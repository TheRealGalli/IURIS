name: Pubblica IURIS su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v6
        with:
          # storia completa: check-segni-migrati legge dalla storia git i vecchi Originali tolti dal repository
          fetch-depth: 0
      - name: Prepara Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Installa le dipendenze
        run: npm ci
      - name: Installa i browser per il controllo responsive (WebKit come Safari su iPhone e iPad, Chromium come Android)
        run: npx playwright install --with-deps chromium webkit
      - name: Genera contenuti e app
        run: npm run build
      - name: Verifica i file da pubblicare
        run: npm run check:build
      - name: Prepara GitHub Pages
        uses: actions/configure-pages@v5
      - name: Carica il sito
        uses: actions/upload-pages-artifact@v4
        with:
          path: studio/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4

